<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trxe de - Valorant Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #f2f2f2;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            border-bottom: 1px solid #1a1a1a;
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
        }

        nav .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #b300ff;
        }

        nav .status {
            font-size: 0.875rem;
            color: #999;
        }

        /* Hero Section */
        .hero {
            border-bottom: 1px solid #1a1a1a;
            padding: 5rem 1.5rem;
        }

        .hero .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .hero-avatar {
            display: flex;
            justify-content: center;
        }

        .avatar-frame {
            position: relative;
            width: 256px;
            height: 320px;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 2px solid rgba(179, 0, 255, 0.5);
            box-shadow: 0 20px 25px rgba(179, 0, 255, 0.2);
            transition: border-color 0.3s;
        }

        .avatar-frame:hover {
            border-color: #b300ff;
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-info h2 {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            word-wrap: break-word;
        }

        .hero-info .subtitle {
            font-size: 1.25rem;
            color: #999;
            margin-bottom: 1rem;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: #b300ff;
            border-radius: 9999px;
            margin-bottom: 2rem;
        }

        .hero-info .description {
            font-size: 1rem;
            color: #ccc;
            max-width: 500px;
            line-height: 1.6;
        }

        /* Links Section */
        .links {
            padding: 5rem 1.5rem;
        }

        .links .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .links h3 {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 3rem;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .link-button {
            position: relative;
            overflow: hidden;
            background: #151515;
            border: 1px solid #222;
            border-radius: 0.5rem;
            padding: 1.5rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
        }

        .link-button:hover {
            border-color: #b300ff;
            box-shadow: 0 10px 25px rgba(179, 0, 255, 0.2);
        }

        .link-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent, rgba(179, 0, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .link-button:hover::before {
            transform: translateX(100%);
        }

        .link-button-content {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .link-button h4 {
            font-size: 1.125rem;
            font-weight: bold;
            color: #b300ff;
            margin-bottom: 0.25rem;
        }

        .link-button p {
            font-size: 0.875rem;
            color: #999;
        }

        .link-icon {
            width: 20px;
            height: 20px;
            color: #b300ff;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .link-button:hover .link-icon {
            opacity: 1;
        }

        /* Stats Section */
        .stats {
            background: rgba(20, 20, 20, 0.4);
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            padding: 5rem 1.5rem;
        }

        .stats .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats h3 {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 0.5rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: #b300ff;
            box-shadow: 0 10px 25px rgba(179, 0, 255, 0.1);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #b300ff;
            margin-bottom: 0.5rem;
        }

        .stat-card .label {
            font-size: 0.875rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .hero .container {
                grid-template-columns: 1fr;
            }

            .hero-info h2 {
                font-size: 2.5rem;
            }

            .avatar-frame {
                width: 240px;
                height: 300px;
            }

            nav h1 {
                font-size: 1.25rem;
            }

            .links h3,
            .stats h3 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <h1>trxe de</h1>
            <div class="status">VALORANT PLAYER</div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <!-- Avatar -->
            <div class="hero-avatar">
                <div class="avatar-frame">
                    <img src="avatar.png" alt="trxe de avatar">
                </div>
            </div>

            <!-- Info -->
            <div class="hero-info">
                <h2>trxe de</h2>
                <p class="subtitle">soukau ev</p>
                <div class="divider"></div>
                <p class="description">eu player valorant описание</p>
            </div>
        </div>
    </section>

    <!-- Links Section -->
    <section class="links">
        <div class="container">
            <h3>CONNECT WITH ME</h3>
            <div class="links-grid">
                <button class="link-button" onclick="copyLink('steam')">
                    <div class="link-button-content">
                        <div>
                            <h4>STEAM</h4>
                            <p>View Steam profile</p>
                        </div>
                        <svg class="link-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7z"/>
                            <path d="M14 3v2h3.59l-9.83 9.83l1.41 1.41L19 6.41V10h2V3z"/>
                        </svg>
                    </div>
                </button>

                <button class="link-button" onclick="copyLink('valorant')">
                    <div class="link-button-content">
                        <div>
                            <h4>VALORANT STATS</h4>
                            <p>View Valorant profile</p>
                        </div>
                        <svg class="link-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7z"/>
                            <path d="M14 3v2h3.59l-9.83 9.83l1.41 1.41L19 6.41V10h2V3z"/>
                        </svg>
                    </div>
                </button>
            </div>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="stats">
        <div class="container">
            <h3>STATS AT A GLANCE</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value">рассия</div>
                    <div class="label">Регион</div>
                </div>
                <div class="stat-card">
                    <div class="value">крутые поцыки</div>
                    <div class="label">Команда</div>
                </div>
                <div class="stat-card">
                    <div class="value">король</div>
                    <div class="label">Статус</div>
                </div>
            </div>
        </div>
    </section>

    <script>
        function copyLink(type) {
            const links = {
                steam: 'https://steamcommunity.com/profiles/76561198735921736/',
                valorant: 'https://tracker.gg/valorant/profile/riot/glycine%20user%231707/overview?playlist=competitive&platform=pc&season=ce2783e8-44fc-dd48-3da3-33b5ba6c4a22'
            };

            const link = links[type];
            navigator.clipboard.writeText(link).then(() => {
                showNotification('Ссылка скопирована!');
            });
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                bottom: 2rem;
                right: 2rem;
                background: #b300ff;
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 0.5rem;
                font-size: 0.875rem;
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
            `;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(400px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(400px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
